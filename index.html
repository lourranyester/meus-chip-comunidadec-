<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Chips — Comunidade da Lou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ===== Paleta (troque aqui) ===== */
  :root{
    --bg:#0F0718; --bg2:#150A22; --card:#1A0F2B; --card2:#26123E; --line:#3A1F5C;
    --text:#F8F2FF; --muted:#C3B0DB; --dim:#7E6A99;
    --accent:#A43BE0; --accent2:#E28BFF; --fire:#5EC8FF;
    --ok:#3DD68C; --warn:#FF9F43; --bad:#FF5C6C;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:radial-gradient(1200px 600px at 80% -10%, rgba(164,59,224,.22), transparent 60%), var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:780px;margin:0 auto;padding:22px 18px 72px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:48px;height:48px;min-width:48px;border-radius:14px;background:#F8F2FF;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(164,59,224,.35)}
  .logo img{width:38px;height:38px}
  .brandTxt{font-family:Oswald,Manrope,sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);font-weight:600}
  h1{font-size:28px;line-height:1.15;margin:0;font-weight:800}
  h2{font-size:19px;margin:0 0 10px;font-weight:800}
  h3{font-size:16px;margin:0 0 6px;font-weight:800}
  p{color:var(--muted);line-height:1.5;margin:0 0 12px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
  .hello{margin:18px 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
  input,select,button{font-family:inherit;font-size:16px}
  input[type=text],input[type=date],input[type=number],select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;color-scheme:dark}
  input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
  label.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px 18px;font-weight:800;cursor:pointer;width:100%;transition:transform .08s, filter .15s}
  .btn:active{transform:scale(.98)}
  .btn:hover{filter:brightness(1.08)}
  .btn.inline{width:auto;padding:11px 16px;font-size:14px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
  .btn.ok{background:var(--ok);color:#06210F}
  .btn.bad{background:var(--bad)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .hint{font-size:13px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
  .stat b{display:block;font-size:28px;font-weight:800;line-height:1.1}
  .stat span{font-size:12px;color:var(--muted);font-weight:700}
  .chipCard{display:flex;gap:16px;align-items:center;cursor:pointer;transition:border-color .15s, transform .1s}
  .chipCard:hover{border-color:var(--accent)}
  .chipCard:active{transform:scale(.99)}
  .chipName{font-weight:800;font-size:18px}
  .chipSub{font-size:13px;color:var(--muted);margin-top:3px}
  .badge{display:inline-block;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;white-space:nowrap}
  .b-heat{background:rgba(226,139,255,.16);color:var(--accent2)}
  .b-fire{background:rgba(94,200,255,.16);color:var(--fire)}
  .b-pause{background:rgba(255,159,67,.16);color:var(--warn)}
  .b-dead{background:rgba(255,92,108,.16);color:var(--bad)}
  .ring{--p:0;width:58px;height:58px;min-width:58px;border-radius:50%;background:conic-gradient(var(--accent2) calc(var(--p)*1%), var(--line) 0);display:flex;align-items:center;justify-content:center}
  .ring>div{width:46px;height:46px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
  .back{background:none;border:0;color:var(--muted);font-weight:700;cursor:pointer;padding:0;margin-bottom:14px;font-size:14px}
  .hero{background:linear-gradient(135deg,var(--card2),var(--card));}
  .heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .big{font-size:48px;font-weight:800;line-height:1;margin-top:6px}
  .big small{font-size:20px;color:var(--muted);font-weight:700}
  .bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden;margin:10px 0 6px}
  .bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .bar.ok>div{background:linear-gradient(90deg,var(--ok),#7CF0B8)}
  .bar.over>div{background:linear-gradient(90deg,var(--warn),var(--bad))}
  .item{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none}
  .item:first-of-type{border-top:0}
  .box{width:26px;height:26px;min-width:26px;border:2px solid var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:background .15s}
  .item.done .box{background:var(--accent)}
  .item.done .box::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .item span{line-height:1.45;font-size:16px}
  .item.done span{color:var(--muted);text-decoration:line-through}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
  .dayDot{border:2px solid var(--line);border-radius:12px;padding:11px 0;text-align:center;font-weight:800;cursor:pointer;font-size:14px;color:var(--muted);background:var(--bg)}
  .dayDot.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .dayDot.today{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(226,139,255,.25)}
  .dayDot.future{opacity:.35;cursor:default}
  .dayDot.partial{border-color:var(--accent);color:var(--text)}
  .item.locked{opacity:.45}
  .dailyLbl + .item{border-top:0}
  .month{background:linear-gradient(135deg,var(--card2),var(--card))}
  .monthHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .monthNum{font-size:34px;font-weight:800;line-height:1.1;margin-top:4px}
  .monthNum small{font-size:15px;color:var(--muted);font-weight:700}
  .monthRow{display:flex;justify-content:space-between;gap:10px}
  .planDay.clk{cursor:pointer}
  .planDay.clk:hover{border-color:var(--accent)}
  .planDay.fut{opacity:.55}
  .planDay i{display:block;font-style:normal;font-size:10px;font-weight:700;margin-top:3px;color:var(--dim)}
  .planDay.hit i{color:var(--ok)} .planDay.overd i{color:var(--warn)} .planDay.low i{color:var(--accent2)}
  .know{border-color:rgba(226,139,255,.35)}
  .knowHead{display:flex;align-items:center;gap:10px}
  .knowIc{width:34px;height:34px;border-radius:10px;background:rgba(226,139,255,.16);color:var(--accent2);display:flex;align-items:center;justify-content:center}
  .tip{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:12px;padding:14px;margin-bottom:10px}
  .constancy{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(164,59,224,.14);color:var(--accent2);font-weight:700;font-size:14px}
  .dailyLbl{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent2);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .welcome{background:linear-gradient(135deg,rgba(164,59,224,.28),rgba(226,139,255,.10));border:1px solid rgba(226,139,255,.35);border-radius:20px;padding:20px;margin:16px 0 18px}
  .welcomeTop{display:flex;align-items:center;gap:8px}
  .heart{color:#FF6FB1;display:inline-flex;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
  .bigIc{width:56px;height:56px;border-radius:16px;background:rgba(164,59,224,.16);color:var(--accent2);display:flex;align-items:center;justify-content:center;margin:0 auto}
  .mIc{display:inline-flex;vertical-align:-3px;margin-right:8px;color:var(--accent2)}
  .modeRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .modeOpt{text-align:left;background:var(--bg);border:2px solid var(--line);color:var(--text);border-radius:14px;padding:14px;cursor:pointer}
  .modeOpt b{display:block;font-size:15px}
  .modeOpt small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}
  .modeOpt.on{border-color:var(--accent);background:rgba(164,59,224,.15)}
  .trash{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;width:38px;height:38px;min-width:38px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  .trash:hover{border-color:var(--bad);background:rgba(255,92,108,.12)}
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:14px}
  .tabBtn{flex:1;background:transparent;border:0;color:var(--muted);font-weight:800;padding:11px;border-radius:10px;cursor:pointer;font-size:15px}
  .tabBtn.on{background:var(--accent);color:#fff}
  .goal{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .goalNum{font-size:56px;font-weight:800;line-height:1}
  .goalNum small{font-size:18px;color:var(--muted)}
  .logRow{display:flex;gap:8px;align-items:center;margin-top:12px}
  .logRow input{margin:0;flex:1}
  .plan{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
  .planDay{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center}
  .planDay b{display:block;font-size:15px}
  .planDay span{font-size:11px;color:var(--muted);font-weight:700}
  .planDay.today{border-color:var(--accent);background:rgba(164,59,224,.18)}
  .hist{width:100%;border-collapse:collapse;font-size:14px}
  .hist td{padding:9px 4px;border-top:1px solid var(--line);color:var(--muted)}
  .hist td:last-child{text-align:right;font-weight:800;color:var(--text)}
  .alertCard{border-left:4px solid var(--warn)}
  .deadCard{border-left:4px solid var(--bad)}
  .cause{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .cause .tag{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--warn);text-transform:uppercase}
  .cause.auto .tag{color:var(--accent2)}
  ol{color:var(--muted);line-height:1.7;padding-left:20px;margin:0 0 14px}
  .opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;font-weight:700}
  .opt small{display:block;color:var(--muted);font-weight:600;margin-top:4px}
  .opt:hover{border-color:var(--accent)}
  .empty{text-align:center;padding:34px 20px}
  .modal{position:fixed;inset:0;background:rgba(5,9,25,.8);display:none;align-items:flex-start;justify-content:center;padding:18px;z-index:10;overflow-y:auto}
  .modal.open{display:flex}
  .modal .card{max-width:520px;width:100%;margin:30px 0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#06210F;font-weight:800;padding:12px 18px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  footer{text-align:center;font-size:12px;color:var(--dim);margin-top:30px;line-height:1.6}
  @media (max-width:540px){ .stats{grid-template-columns:repeat(2,1fr)} .big{font-size:40px} .goalNum{font-size:46px} .plan{grid-template-columns:repeat(4,1fr)} }

  /* ===== Visual preto (estilo do modelo) ===== */
  :root{
    --bg:#000000; --bg2:#0A0A0A; --card:rgba(17,17,20,.78); --card2:rgba(26,20,36,.85); --line:rgba(55,65,81,.55);
    --text:#FFFFFF; --muted:#9CA3AF; --dim:#6B7280;
    --accent:#A855F7; --accent2:#C084FC;
  }
  body{font-family:Poppins,system-ui,sans-serif;background:#000;animation:fadeIn .5s ease-out}
  /* fundo em grade com brilho roxo (adaptado do modelo background-snippets) */
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background-image:linear-gradient(to right,rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:6rem 4rem}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(circle 800px at 100% 200px,rgba(168,85,247,.28),transparent),radial-gradient(700px 420px at 50% -160px,rgba(168,85,247,.22),transparent 70%)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ body{animation:none} }
  h1,h2,h3{font-weight:600;letter-spacing:-.02em}
  .wrap{padding-top:0}
  .top{position:sticky;top:0;z-index:20;margin:0 -18px 8px;padding:14px 18px;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .logo{width:40px;height:40px;min-width:40px;border-radius:10px;box-shadow:none}
  .logo img{width:32px;height:32px}
  .brandTxt{font-family:Poppins,sans-serif;font-size:11px;letter-spacing:.5px;text-transform:none;color:var(--muted);font-weight:500}
  .brand h1{font-size:19px;font-weight:600}
  .card{border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .hero,.month{background:var(--card2)}
  .btn{background:linear-gradient(to bottom,#fff,rgba(255,255,255,.95),rgba(255,255,255,.7));color:#000;border-radius:8px;font-weight:600;transition:transform .15s}
  .btn:hover{filter:none;transform:scale(1.03)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:#fff}
  .btn.ghost:hover{background:rgba(31,41,55,.5)}
  .btn.warn{background:transparent;border:1px solid rgba(255,159,67,.6);color:var(--warn)}
  .btn.ok{background:var(--ok);color:#03150B}
  .btn.bad{background:var(--bad);color:#fff}
  input[type=text],input[type=date],input[type=number],select{background:#0A0A0A;border-radius:8px}
  input:focus,select:focus{outline:2px solid var(--accent)}
  .welcome{text-align:center;background:none;border:0;padding:40px 0 30px;margin:0}
  .welcomeTop{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid #374151;background:rgba(31,41,55,.5)}
  .welcomeTop .hint{font-size:12px;font-weight:500!important;color:var(--muted)}
  .welcome h2{font-size:42px!important;line-height:1.1;margin:18px 0 14px!important;letter-spacing:-.05em;font-weight:600;background:linear-gradient(to bottom,#fff,#fff,rgba(255,255,255,.6));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .welcome p{max-width:44ch;margin:0 auto!important;color:var(--muted)!important;opacity:1!important}
  .stat{border-radius:14px;background:var(--card)}
  .stat b{font-weight:600}
  .chipName{font-weight:600}
  .badge{font-weight:600;border:1px solid currentColor;background:transparent!important}
  .big,.goalNum,.monthNum{font-weight:600;letter-spacing:-.03em}
  .ring>div{background:#111114;font-weight:600}
  .tabs{background:rgba(17,17,20,.8);border-radius:10px}
  .tabBtn{font-weight:600;border-radius:8px}
  .tabBtn.on{background:#fff;color:#000}
  .dayDot{border-radius:8px;border-width:1px;background:#0A0A0A}
  .planDay{background:#0A0A0A}
  .modeOpt{background:#0A0A0A;border-width:1px}
  .modeOpt.on{background:rgba(168,85,247,.14)}
  .item.done .box{background:var(--accent)}
  .toast{background:#fff;color:#000;border-radius:8px}
  .constancy{background:rgba(168,85,247,.12);color:var(--accent2)}
  @media (max-width:540px){ .welcome h2{font-size:34px!important} }


  /* borda com feixe de luz (adaptado do BorderBeam) */
  @property --beam-a{syntax:"<angle>";inherits:false;initial-value:0deg}
  .beam{position:relative;background:#16111F!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .beam::before,.beam::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
    background:conic-gradient(from var(--beam-a),transparent 0deg,transparent 220deg,rgba(100,80,220,.0) 230deg,#6450DC 260deg,#A855F7 295deg,#F0B4FF 318deg,#3C78FF 340deg,transparent 360deg);
    animation:beamspin 5s linear infinite}
  .beam::before{padding:1.5px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);z-index:1}
  .beam::after{z-index:-1;filter:blur(12px);opacity:.6}
  .beam>*{position:relative;z-index:2}
  @keyframes beamspin{to{--beam-a:360deg}}
  @media (prefers-reduced-motion:reduce){ .beam::before,.beam::after{animation:none} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURAÇÃO — edite aqui textos e números
   ========================================================= */
const WARMUP_DAYS = 7;
const RAMP = { start:42, step:20, max:120 };   // dia 1 de disparo: 42, depois +20 por dia, até 120
/* Plano de 7 dias: o que fazer em cada dia (a conversa de 2 a 3 horas entra em todos) */
const PLAN = [
  {title:"Montar o perfil", tasks:[
    {id:"perfil", text:"Colocar foto do perfil e nome"},
    {id:"zap",    text:"Ativar o aquecimento na Zap Vibe"}]},
  {title:"Movimentar as conversas", tasks:[
    {id:"midias", text:"Mandar áudio, foto e figurinha nas conversas"}]},
  {title:"Chamar empresas", tasks:[
    {id:"empresas", text:"Chamar 6 empresas da lista da Aula 6 do módulo Aquecimento de Chip"}]},
  {title:"Anúncio na OLX", tasks:[
    {id:"olx",    text:"Fazer anúncio na OLX com o número do chip"}]},
  {title:"Responder quem chamou", tasks:[
    {id:"resp",   text:"Responder todo mundo que chamou pelos grupos e pela OLX"}]},
  {title:"Movimentar o número", tasks:[
    {id:"salvos", text:"Garantir 6 pessoas com o seu contato salvo. Pra facilitar, use a lista da Aula 6 do módulo Aquecimento de Chip"},
    {id:"status", text:"Postar um status e interagir nos grupos"},
    {id:"video",  text:"Fazer uma ligação de vídeo com um contato"}]},
  {title:"Preparar o primeiro disparo", tasks:[
    {id:"lista",  text:"Separar os contatos dos grupos pro primeiro disparo (42 mensagens)"},
    {id:"revisao",text:"Conferir se todos os dias anteriores estão completos"}]}
];
const CHECKLIST = PLAN.flatMap(p=>p.tasks);
const MOTIVATION = "Chip cair faz parte da rotina de quem trabalha com disparo. Não desanima: quem tem resultado é quem mantém a constância.";
const DAILY_TEXT = "Deixar 2 a 3 horas conversando";
const GROUPS_TEXT = "Entrar em 6 grupos e pedir pra te chamarem";
const PRE = [
  "Lista conferida, com DDD",
  "Sem link na primeira mensagem",
  "Intervalo igual ao da aula Disparo na Prática",
  "Horário comercial"
];
/* Causas perguntadas no diagnóstico (o aluno marca) */
const ASK_CAUSES = [
  {id:"link",   q:"Mandei link já na primeira mensagem",
   why:"Link na primeira mensagem tem cara de spam pro WhatsApp.",
   fix:"Mande o link só depois que a pessoa responder."},
  {id:"interv", q:"Não usei o intervalo ensinado na aula Disparo na Prática",
   why:"Mensagens saindo rápido demais, em ritmo de máquina, chamam atenção.",
   fix:"Configure o intervalo igual ao da aula Disparo na Prática."},
  {id:"bloq",   q:"Muita gente me bloqueou ou não respondeu",
   why:"Muitos bloqueios avisam o WhatsApp que a mensagem não é bem-vinda.",
   fix:"Revise a lista e a mensagem. Dê sempre a opção de sair."},
  {id:"horario",q:"Disparei de madrugada ou fora do horário comercial",
   why:"Mensagem em horário estranho gera mais bloqueio e denúncia.",
   fix:"Dispare em horário comercial."}
];

/* ===== Datas ===== */
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return iso(new Date()); }
function addDays(s,n){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function fmt(s){ const [y,m,d]=s.split("-"); return d+"/"+m; }
function fmtFull(s){ const [y,m,d]=s.split("-"); return d+"/"+m+"/"+y; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ===== Regras do chip ===== */
function dayOf(c){ return Math.max(1, diffDays(c.start, todayStr())+1); }      // dia 1 = data de ativação
function warmDone(c){ return CHECKLIST.filter(i=>c.checks[i.id]).length; }
function convDone(c){ let n=0; for(let k=1;k<=WARMUP_DAYS;k++) if(c.daily[k]) n++; return n; }
function groupsDone(c){ c.groups=c.groups||{}; let n=0; for(let k=1;k<=WARMUP_DAYS;k++) if(c.groups[k]) n++; return n; }
function rampStart(c){ return c.ramp ? c.ramp.date : addDays(c.start, WARMUP_DAYS); }
function rampBase(c){ return c.ramp ? c.ramp.base : RAMP.start; }
function goalOn(c, date){
  const k = diffDays(rampStart(c), date);
  if(k < 0) return 0;
  return Math.min(RAMP.max, rampBase(c) + RAMP.step*k);
}
function fireDay(c){ return diffDays(rampStart(c), todayStr())+1; }
function status(c){
  if(c.dead)   return {key:"dead",  label:"Caiu",                cls:"b-dead"};
  if(c.paused) return {key:"pause", label:"Pausado",             cls:"b-pause"};
  if(dayOf(c) <= WARMUP_DAYS && !c.ramp) return {key:"heat", label:"Aquecendo · Dia "+dayOf(c)+"/"+WARMUP_DAYS, cls:"b-heat"};
  return {key:"fire", label:"Disparando", cls:"b-fire"};
}
function warmPct(c){ return Math.round((warmDone(c)+convDone(c)+groupsDone(c))/(CHECKLIST.length+2*WARMUP_DAYS)*100); }

/* ===== Diagnóstico automático com os dados do app ===== */
function autoCauses(c){
  const out=[];
  const sentEntries = Object.entries(c.sent||{});
  const early = sentEntries.filter(([d,n])=>n>0 && diffDays(c.start,d)+1 <= WARMUP_DAYS);
  if(early.length) out.push({tag:"Detectado pelo app", why:`Você registrou disparo durante o aquecimento (antes do dia ${WARMUP_DAYS+1}).`, fix:`Disparar antes de completar os ${WARMUP_DAYS} dias é a causa mais comum de chip caindo.`});
  const over = sentEntries.filter(([d,n])=>{ const g=goalOn(c,d); return g>0 && n>g; });
  if(over.length) out.push({tag:"Detectado pelo app", why:`Você passou da meta em ${over.length} ${over.length>1?"dias":"dia"} (ex.: ${fmt(over[0][0])}: ${over[0][1]} disparos, meta ${goalOn(c,over[0][0])}).`, fix:"Seguir a meta de cada dia ajuda o chip a se acostumar com os disparos."});
  const conv = convDone(c);
  if(!c.prewarm && conv < WARMUP_DAYS) out.push({tag:"Detectado pelo app", why: conv===0 ? `Você não marcou conversa em nenhum dia do aquecimento.` : `Você marcou conversa em só ${conv} dos ${WARMUP_DAYS} dias de aquecimento.`, fix:"Conversa de verdade todo dia é o que dá histórico pro número."});
  const grp = groupsDone(c);
  if(!c.prewarm && grp < WARMUP_DAYS) out.push({tag:"Detectado pelo app", why: grp===0 ? `Você não marcou a entrada nos 6 grupos em nenhum dia do aquecimento.` : `Você entrou nos 6 grupos em só ${grp} dos ${WARMUP_DAYS} dias de aquecimento.`, fix:"Entrar nos grupos e pedir pra te chamarem todo dia gera conversa real com gente nova."});
  const miss = CHECKLIST.filter(i=>!c.checks[i.id]);
  if(!c.prewarm && miss.length){
    const days=PLAN.map((p,k)=>p.tasks.some(t=>!c.checks[t.id])?k+1:0).filter(Boolean);
    out.push({tag:"Detectado pelo app", why:`Ficaram ${miss.length} ${miss.length>1?"tarefas":"tarefa"} do plano de aquecimento sem marcar (${days.length>1?"dias":"dia"} ${days.join(", ")}).`, fix:"Cada tarefa do plano ajuda o número a ter cara de pessoa real. No próximo chip, siga o plano dia a dia."});
  }
  return out;
}

function render(){
  const app=document.getElementById("app");
  if(booting){ app.innerHTML=`<div class="top">${brandHtml()}</div><div class="card" style="text-align:center;padding:40px"><p style="margin:0">Carregando seus chips…</p></div>`; return; }
  if(view.page==="newpass"){ app.innerHTML=newPassView(); bindNewPass(); return; }
  if(!session){ app.innerHTML=loginView(); bindLogin(); return; }
  if(view.page==="new"){ app.innerHTML=newView(); bindNew(); return; }
  if(view.page==="chip"){
    const c=state.chips.find(x=>x.id===view.chip);
    if(c){ app.innerHTML=chipView(c); bindChip(c); return; }
    view={page:"home"};
  }
  app.innerHTML=homeView(); bindHome();
}

/* ---- Entrada ---- */
function loginView(){
  const signup = authMode==="signup", forgot = authMode==="forgot";
  return `<div class="top">${brandHtml()}</div>
  <div class="welcome"><div class="welcomeTop"><span class="hint" style="font-weight:700">Comunidade da Lou</span></div>
    <h2 style="font-size:26px;margin:6px 0 6px">${forgot?"Recuperar senha":signup?"Criar sua conta":"Entrar no Meus Chips"}</h2>
    <p style="margin:0">${forgot?"Coloque seu e-mail que a gente te manda um link pra criar uma senha nova.":signup?"Crie sua conta pra organizar seus chips em qualquer celular.":"Seus chips, checklists e metas, salvos na sua conta."}</p></div>
  <div class="card hero">
    ${!forgot?`<div class="tabs" style="margin-bottom:16px"><button class="tabBtn ${!signup?"on":""}" data-auth="login">Entrar</button><button class="tabBtn ${signup?"on":""}" data-auth="signup">Criar conta</button></div>`:""}
    ${signup?`<label class="lbl" for="nm">Seu nome</label><input type="text" id="nm" placeholder="Como você quer ser chamado(a)" autocomplete="name">`:""}
    <label class="lbl" for="em">E-mail</label>
    <input type="email" id="em" placeholder="seu@email.com" autocomplete="email" style="width:100%;background:#0A0A0A;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:12px">
    ${!forgot?`<label class="lbl" for="pw">Senha</label><input type="password" id="pw" placeholder="${signup?"Mínimo de 6 caracteres":"Sua senha"}" autocomplete="${signup?"new-password":"current-password"}" style="width:100%;background:#0A0A0A;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:12px">`:""}
    ${signup&&ACCESS_CODE?`<label class="lbl" for="ac">Código de acesso</label><input type="text" id="ac" placeholder="Código que está na área de membros">`:""}
    <button class="btn" id="go">${forgot?"Enviar link":signup?"Criar conta":"Entrar"}</button>
    <p class="hint" id="authMsg" style="margin:12px 0 0;min-height:18px"></p>
    <div style="text-align:center;margin-top:6px">${forgot?`<button class="back" data-auth="login">Voltar pra entrar</button>`:!signup?`<button class="back" data-auth="forgot">Esqueci minha senha</button>`:""}</div>
  </div>`;
}
function bindLogin(){
  const $=id=>document.getElementById(id), msg=t=>{ $("authMsg").textContent=t; };
  document.querySelectorAll("[data-auth]").forEach(b=>b.onclick=()=>{ authMode=b.dataset.auth; render(); });
  const go=async()=>{
    const email=($("em").value||"").trim(), pw=$("pw")?$("pw").value:"";
    if(!email){ msg("Coloque seu e-mail."); return; }
    $("go").disabled=true; msg("Aguarde…");
    try{
      if(authMode==="forgot"){
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
        if(error) throw error; msg("Pronto! Confira seu e-mail (e a caixa de spam).");
      } else if(authMode==="signup"){
        const nome=($("nm").value||"").trim();
        if(!nome){ msg("Coloque seu nome."); $("go").disabled=false; return; }
        if(pw.length<6){ msg("A senha precisa ter pelo menos 6 caracteres."); $("go").disabled=false; return; }
        if(ACCESS_CODE && ($("ac").value||"").trim().toUpperCase()!==ACCESS_CODE.toUpperCase()){ msg("Código de acesso inválido. Pegue o código na área de membros."); $("go").disabled=false; return; }
        const { data, error } = await sb.auth.signUp({ email, password: pw, options:{ data:{ nome }, emailRedirectTo: location.origin + location.pathname } });
        if(error) throw error;
        if(!data.session){ msg("Conta criada! Confirme pelo link que mandamos no seu e-mail e depois entre."); authMode="login"; }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password: pw });
        if(error) throw error;
      }
    }catch(e){
      const m=(e.message||"").toLowerCase();
      msg(m.includes("invalid login")?"E-mail ou senha incorretos.":m.includes("already registered")?"Esse e-mail já tem conta. Use a aba Entrar.":m.includes("not confirmed")?"Confirme seu e-mail pelo link que mandamos antes de entrar.":"Não deu certo: "+e.message);
    }
    if($("go")) $("go").disabled=false;
  };
  $("go").onclick=go;
  ["em","pw"].forEach(id=>{ if($(id)) $(id).onkeydown=e=>{ if(e.key==="Enter") go(); }; });
}
function newPassView(){
  return `<div class="top">${brandHtml()}</div>
  <div class="card hero"><h2>Criar nova senha</h2>
    <label class="lbl" for="np">Nova senha</label>
    <input type="password" id="np" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" style="width:100%;background:#0A0A0A;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:12px">
    <button class="btn" id="saveNp">Salvar senha</button><p class="hint" id="npMsg" style="margin:12px 0 0"></p></div>`;
}
function bindNewPass(){
  document.getElementById("saveNp").onclick=async()=>{
    const v=document.getElementById("np").value;
    if(v.length<6){ document.getElementById("npMsg").textContent="Mínimo de 6 caracteres."; return; }
    const { error } = await sb.auth.updateUser({ password: v });
    if(error){ document.getElementById("npMsg").textContent="Não deu certo: "+error.message; return; }
    await pullRemote(); view={page:"home"}; render(); toast("Senha atualizada!");
  };
}

/* ---- Painel ---- */
function homeView(){
  const st=state.chips.map(status);
  const count=k=>st.filter(s=>s.key===k).length;
  const sentToday=state.chips.reduce((n,c)=>n+((c.sent||{})[todayStr()]||0),0);
  let h=`<div class="top">${brandHtml()}<button class="btn inline" id="newBtn">+ Novo chip</button></div>
  <div class="welcome">
    <div class="welcomeTop"><span class="hint" style="font-weight:700">Comunidade da Lou</span></div>
    <h2 style="font-size:26px;margin:6px 0 6px">Que bom te ver, ${esc(state.name)}!</h2>
    <p style="margin:0;color:var(--text);opacity:.9">Que bom ter você aqui na Comunidade da Lou. Cada chip bem cuidado é um passo a mais rumo ao seu resultado, e eu tô junto com você nessa.</p>
    ${sentToday?`<p class="hint" style="margin:10px 0 0">Hoje você já registrou <b style="color:var(--text)">${sentToday}</b> disparos. Continua assim.</p>`:""}
  </div>
  <div class="stats">
    <div class="stat"><b style="color:var(--accent2)">${count("heat")}</b><span>Aquecendo</span></div>
    <div class="stat"><b style="color:var(--fire)">${count("fire")}</b><span>Disparando</span></div>
    <div class="stat"><b style="color:var(--warn)">${count("pause")}</b><span>Pausados</span></div>
    <div class="stat"><b style="color:var(--bad)">${count("dead")}</b><span>Caíram</span></div>
  </div>` + monthHtml();
  if(!state.chips.length){
    h+=`<div class="card empty hero"><h2>Cadastre seu primeiro chip</h2><p>O app te guia no aquecimento de ${WARMUP_DAYS} dias e depois te dá a meta de disparo de cada dia.</p><button class="btn" id="newBtn2">Cadastrar chip</button></div>`;
  } else {
    const order={heat:0,fire:1,pause:2,dead:3};
    [...state.chips].sort((a,b)=>order[status(a).key]-order[status(b).key]).forEach(c=>{
      const s=status(c); let left="", sub="";
      if(s.key==="heat"){
        left=`<div class="ring" style="--p:${warmPct(c)}"><div>${warmPct(c)}%</div></div>`;
        sub = (c.daily[dayOf(c)] && (c.groups||{})[dayOf(c)]) ? "Tarefas diárias de hoje feitas" : "Faltam as tarefas diárias de hoje";
      } else if(s.key==="fire"){
        const g=goalOn(c,todayStr()), n=(c.sent||{})[todayStr()]||0;
        left=`<div class="ring" style="--p:${Math.min(100,Math.round(n/g*100))}"><div>${n}</div></div>`;
        sub=`Meta de hoje: ${g} disparos`;
      } else if(s.key==="pause"){
        left=`<div class="ring" style="--p:0"><div style="color:var(--warn);display:flex">${I.pause}</div></div>`; sub="Siga os passos antes de voltar";
      } else {
        left=`<div class="ring" style="--p:0"><div style="color:var(--bad);display:flex">${I.x}</div></div>`; sub="Veja o diagnóstico";
      }
      h+=`<div class="card chipCard" data-open="${c.id}">${left}
        <div style="flex:1;min-width:0"><div class="chipName">${esc(c.name)}</div><div style="margin:6px 0 2px"><span class="badge ${s.cls}">${s.label}</span></div><div class="chipSub">${c.number?esc(c.number)+" · ":""}${sub}</div></div>
        <button class="trash" data-del="${c.id}" title="Excluir chip" aria-label="Excluir ${esc(c.name)}">${I.trash}</button></div>`;
    });
  }
  h+=`<footer>Logado como ${esc(session.user.email)}<br><button class="back" id="logout" style="margin:6px 0 0">Sair da conta</button></footer>`;
  return h;
}

/* ---- Meta do mês ---- */
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function monthKey(){ return todayStr().slice(0,7); }
function monthSent(){
  const mk=monthKey(); let t=0;
  state.chips.forEach(c=>Object.entries(c.sent||{}).forEach(([d,n])=>{ if(d.slice(0,7)===mk) t+=n||0; }));
  return t;
}
function todaySentAll(){ const t=todayStr(); return state.chips.reduce((n,c)=>n+((c.sent||{})[t]||0),0); }
function monthHtml(){
  state.goals=state.goals||{};
  const mk=monthKey(), goal=state.goals[mk]||0, done=monthSent();
  const now=new Date(), mName=MESES[now.getMonth()];
  const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const daysLeft=lastDay-now.getDate()+1;
  if(!goal){
    return `<div class="card month beam"><div class="monthHead"><div><div class="hint">Meta de ${mName}</div><h2 style="margin:2px 0 0">Quantos disparos você quer fazer este mês?</h2></div></div>
      <p style="margin:10px 0 12px">Defina sua meta e acompanhe aqui o total de disparos que você registrar em todos os seus chips.</p>
      <div class="logRow" style="margin-top:0"><input type="number" id="goalInput" min="1" inputmode="numeric" placeholder="Ex.: 3000"><button class="btn inline" id="saveGoal">Definir meta</button></div>
      ${done?`<p class="hint" style="margin:12px 0 0">Você já registrou <b style="color:var(--text)">${done.toLocaleString("pt-BR")}</b> disparos em ${mName}.</p>`:""}
    </div>`;
  }
  const pct=Math.min(100,Math.round(done/goal*100)), left=Math.max(0,goal-done);
  const perDay=Math.ceil(left/daysLeft);
  const msg = done>=goal ? "Meta do mês batida! Que orgulho. Bora pra próxima." :
    `Faltam <b style="color:var(--text)">${left.toLocaleString("pt-BR")}</b>. Dá uns <b style="color:var(--text)">${perDay.toLocaleString("pt-BR")}</b> por dia nos ${daysLeft} ${daysLeft>1?"dias":"dia"} que restam.`;
  return `<div class="card month beam">
    <div class="monthHead"><div><div class="hint">Meta de ${mName}</div>
      <div class="monthNum">${done.toLocaleString("pt-BR")} <small>/ ${goal.toLocaleString("pt-BR")} disparos</small></div></div>
      <div class="row" style="flex-wrap:nowrap"><button class="btn ghost inline" id="editGoal">Editar</button><button class="trash" id="delGoal" title="Apagar meta" aria-label="Apagar meta">${I.trash}</button></div></div>
    <div class="bar ${done>=goal?"ok":""}" style="height:12px"><div style="width:${pct}%"></div></div>
    <div class="monthRow"><span class="hint">${pct}% da meta</span><span class="hint">Hoje: <b style="color:var(--text)">${todaySentAll().toLocaleString("pt-BR")}</b> disparos</span></div>
    <p style="margin:10px 0 0">${msg}</p>
    <p class="hint" style="margin:8px 0 0">O total soma os disparos que você registra em cada chip. Lembre de registrar todo dia.</p>
  </div>`;
}

    const go=()=>{ const v=parseInt($("goalInput").value,10); if(!v||v<1){ toast("Coloque um número"); return; } state.goals=state.goals||{}; state.goals[monthKey()]=v; save(); render(); toast("Meta definida!"); };

    <input type="number" id="mGoal" min="1" inputmode="numeric" value="${state.goals[monthKey()]||""}">

      $("mDel").onclick=()=>{ delete state.goals[monthKey()]; save(); closeModal(); render(); toast("Meta apagada"); };
      $("mYes").onclick=()=>{ const v=parseInt($("mGoal").value,10); if(!v||v<1){ toast("Coloque um número"); return; } state.goals[monthKey()]=v; save(); closeModal(); render(); toast("Meta atualizada"); };
    });
}

/* ---- Tela do chip ---- */
function chipView(c){
  const s=status(c), d=dayOf(c), today=todayStr();
  let h=`<button class="back" id="back">← Meus chips</button>`;

  /* Cabeçalho */
  let bigTxt="", sub="";
  if(s.key==="heat"){ bigTxt=`Dia ${d} <small>de ${WARMUP_DAYS}</small>`; sub="Aquecimento"; }
  else if(s.key==="fire"){ bigTxt=`Dia ${fireDay(c)} <small>de disparo</small>`; sub="Disparando"; }
  else if(s.key==="pause"){ bigTxt=`Pausado`; sub="Chip em recuperação"; }
  else { bigTxt=`Caiu`; sub="Chip fora do ar"; }
  h+=`<div class="card hero beam"><div class="heroTop"><div>
      <div class="chipName">${esc(c.name)}</div>
      <div class="chipSub">${c.number?esc(c.number)+" · ":""}${esc(c.type)} · ${c.prewarm?"cadastrado já aquecido em "+fmtFull(c.ramp?c.ramp.date:addDays(c.start,WARMUP_DAYS)):"ativado em "+fmtFull(c.start)}</div>
    </div><div style="display:flex;gap:8px;align-items:center"><span class="badge ${s.cls}">${s.key==="heat"?"Aquecendo":s.label}</span><button class="trash" id="delTop" title="Excluir chip" aria-label="Excluir chip">${I.trash}</button></div></div>
    <div class="hint" style="margin-top:18px">${sub}</div><div class="big">${bigTxt}</div>
    ${s.key==="heat"?`<div class="bar"><div style="width:${warmPct(c)}%"></div></div><div class="hint">${warmPct(c)}% do aquecimento concluído · começa a disparar em ${fmtFull(addDays(c.start,WARMUP_DAYS))}</div>`:""}
  </div>`;

  /* Caiu */
  if(s.key==="dead"){
    const ev=[...c.events].reverse().find(e=>e.type==="dead");
    h+=`<div class="card deadCard"><h2>Bola pra frente</h2>
      <p>Chip banido em ${ev?fmtFull(ev.date):"-"}. ${motivation(dayIndex()+c.id.length)}</p>
      <ol><li>Pegue o próximo chip. Se ele já estiver aquecido, amanhã você já pode disparar.</li><li>Se quiser, tente recuperar este: na tela de banimento do WhatsApp, toque em "Solicitar análise".</li><li>Mantenha a constância: disparar todo dia é o que faz o resultado vir.</li></ol>
      <div class="row"><button class="btn inline" id="newFromDead">Cadastrar chip novo</button><button class="btn ghost inline" id="reviveBtn">Recuperei o chip</button></div></div>`;
    if(ev && ev.report) h+=reportHtml(ev.report)+knowHtml(c,ev);
  }

  /* Pausado */
  if(s.key==="pause"){
    const ev=[...c.events].reverse().find(e=>e.type==="pause");
    const back=Math.max(RAMP.start, goalOn(c, ev?ev.date:today));
    h+=`<div class="card alertCard"><h2>Bola pra frente</h2>
      <p>${motivation(dayIndex()+c.id.length)}</p>
      <ol><li>Hoje, pare os disparos nesse chip.</li><li>Amanhã você já pode voltar a disparar.</li><li>Volte na mesma meta: <b style="color:var(--text)">${back} disparos</b> por dia.</li><li>Mantenha a constância, todos os dias.</li></ol>
      <button class="btn ok" id="resumeBtn">Voltar a disparar com ${back} por dia</button></div>`;
    if(ev && ev.report) h+=reportHtml(ev.report)+knowHtml(c,ev);
  }

  /* Abas */
  const defTab = s.key==="heat" ? "aq" : "disp";
  const tab = (view.tab && view.tabChip===c.id) ? view.tab : defTab;
  if(s.key!=="dead"){
    h+=`<div class="tabs"><button class="tabBtn ${tab==="aq"?"on":""}" data-tab="aq">Aquecimento</button><button class="tabBtn ${tab==="disp"?"on":""}" data-tab="disp"><span style="display:inline-flex;align-items:center;gap:6px">Disparos${s.key==="heat"?I.lock(14):""}</span></button></div>`;
  }
  if(tab==="disp" && s.key==="heat"){
    const unlock=addDays(c.start,WARMUP_DAYS);
    h+=`<div class="card" style="text-align:center;padding:30px 20px">
      <div class="bigIc">${I.lock(26)}</div>
      <h2 style="margin-top:8px">Sem disparos durante o aquecimento</h2>
      <p>Nos ${WARMUP_DAYS} primeiros dias o chip só aquece. Os disparos liberam em <b style="color:var(--text)">${fmtFull(unlock)}</b>, faltando ${diffDays(todayStr(),unlock)} ${diffDays(todayStr(),unlock)===1?"dia":"dias"}.</p>
      <h3 style="margin-top:18px">Suas primeiras metas</h3>
      <div class="plan">${Array.from({length:7},(_,k)=>`<div class="planDay"><b>${Math.min(RAMP.max,RAMP.start+RAMP.step*k)}</b><span>${fmt(addDays(unlock,k))}</span></div>`).join("")}</div>
    </div>`;
  }
  /* Disparando */
  if(tab==="disp" && s.key==="fire"){
    const rs=rampStart(c);
    let sd=(view.dispDay && view.dispChip===c.id) ? view.dispDay : today;
    if(diffDays(rs,sd)<0 || diffDays(today,sd)>0) sd=today;
    const isToday = sd===today;
    const g=goalOn(c,sd), n=(c.sent||{})[sd]||0, pct=Math.min(100,Math.round(n/g*100));
    const over=n>g;
    const lbl = isToday ? "hoje" : (diffDays(sd,today)===1 ? "ontem" : fmt(sd));
    let msg;
    if(isToday) msg = over ? I.alert+" Você passou da meta. Amanhã segure no limite." : n>=g ? "Meta batida! Amanhã sobe pra "+goalOn(c,addDays(today,1))+"." : "Faltam "+(g-n)+" pra meta de hoje.";
    else msg = n===0 ? "Esqueceu de registrar? Coloque abaixo quantos você disparou nesse dia." : over ? I.alert+" Nesse dia você passou da meta." : n>=g ? "Meta batida nesse dia." : "Nesse dia faltaram "+(g-n)+" pra meta.";
    const first = diffDays(rs,today) > 6 ? addDays(today,-6) : rs;
    const total = diffDays(first,today) + 4;
    h+=`<div class="card"><div class="goal"><div><div class="hint">Meta de ${lbl}</div><div class="goalNum">${g} <small>disparos</small></div></div>
        <div style="text-align:right"><div class="hint">Registrado</div><div style="font-size:28px;font-weight:800;color:${over?"var(--warn)":"var(--text)"}">${n}</div></div></div>
      <div class="bar ${over?"over":n>=g?"ok":""}"><div style="width:${pct}%"></div></div>
      <div class="hint">${msg}</div>
      <div class="logRow"><input type="number" id="sentInput" min="0" inputmode="numeric" placeholder="Quantos você disparou ${isToday?"hoje":lbl==="ontem"?"ontem":"em "+lbl}?" value="${n||""}"><button class="btn inline" id="saveSent" data-date="${sd}">Salvar</button></div>
      <h3 style="margin-top:20px">Seus dias de disparo</h3>
      <p class="hint" style="margin:0 0 4px">Toque em um dia pra ver ou corrigir o que você registrou.</p>
      <div class="plan">${Array.from({length:total},(_,k)=>{const dt=addDays(first,k), fut=diffDays(today,dt)>0, v=(c.sent||{})[dt], gg=goalOn(c,dt);
        const st = fut ? "" : (v===undefined||v===0) ? "miss" : v>gg ? "overd" : v>=gg ? "hit" : "low";
        return `<div class="planDay ${dt===sd?"today":""} ${fut?"fut":"clk"} ${st}" ${fut?'data-fut="1"':""} data-dd="${dt}"><b>${gg}</b><span>${dt===today?"hoje":fmt(dt)}</span>${fut?"":`<i>${v?v+" feitos":"sem registro"}</i>`}</div>`;}).join("")}</div>
      <div class="hint" style="margin-top:10px">Começa em ${RAMP.start} e sobe ${RAMP.step} por dia, até ${RAMP.max}.</div>
      <div class="constancy">O segredo é a constância: dispare todo dia, seguindo a meta.</div>
    </div>`;
    const preToday=(c.pre&&c.pre.date===today)?c.pre.checks:{};
    h+=`<div class="card"><h2>Antes de disparar hoje</h2><p class="hint">Zera todo dia.</p>
      ${PRE.map((t,j)=>`<div class="item ${preToday[j]?"done":""}" data-pre="${j}"><div class="box"></div><span>${esc(t)}</span></div>`).join("")}</div>`;
  }

  /* Checklist de aquecimento (sempre visível; aberto durante o aquecimento) */
  if(tab==="aq" && c.prewarm){
    h+=`<div class="card" style="text-align:center;padding:30px 20px"><div class="bigIc" style="color:var(--ok);background:rgba(61,214,140,.14)">${I.check(26)}</div><h2 style="margin-top:8px">Chip cadastrado já aquecido</h2><p style="margin:0">Esse chip pulou o plano de aquecimento e começou direto nos disparos.</p></div>`;
  }
  if(tab==="aq" && s.key!=="dead" && !c.prewarm){
    const curDay = Math.min(d, WARMUP_DAYS);
    const sel = (view.selDay && view.selChip===c.id) ? view.selDay : curDay;
    c.groups=c.groups||{};
    const dayComplete = n => c.daily[n] && c.groups[n] && PLAN[n-1].tasks.every(t=>c.checks[t.id]);
    const dayStarted  = n => c.daily[n] || c.groups[n] || PLAN[n-1].tasks.some(t=>c.checks[t.id]);
    const plan = PLAN[sel-1], locked = sel > d;
    h+=`<div class="card"><h2>Plano de aquecimento</h2><p class="hint">Toque em um dia pra ver o que fazer. ${warmPct(c)}% concluído.</p>
      <div class="days">${Array.from({length:WARMUP_DAYS},(_,k)=>{const n=k+1;
        return `<div class="dayDot ${dayComplete(n)?"done":""} ${n===sel?"today":""} ${!dayComplete(n)&&dayStarted(n)?"partial":""}" data-sel="${n}">D${n}</div>`;}).join("")}</div>
    </div>
    <div class="card">
      <div class="hint">Dia ${sel} de ${WARMUP_DAYS} · ${fmtFull(addDays(c.start,sel-1))}${sel===curDay&&s.key==="heat"?" · <b style='color:var(--accent2)'>hoje</b>":""}</div>
      <h2 style="font-size:22px;margin-top:4px">${esc(plan.title)}</h2>
      ${locked?`<p style="color:var(--warn);margin:0 0 6px">Esse dia ainda não chegou. Dá pra ver o que vem, mas só marca no dia.</p>`:""}
      ${plan.tasks.map(t=>`<div class="item ${c.checks[t.id]?"done":""} ${locked?"locked":""}" data-check="${t.id}" ${locked?'data-locked="1"':""}><div class="box"></div><span>${esc(t.text)}</span></div>`).join("")}
      <div class="dailyLbl">Todo dia</div>
      <div class="item ${c.daily[sel]?"done":""} ${locked?"locked":""}" data-day="${sel}" ${locked?'data-locked="1"':""}><div class="box"></div><span>${DAILY_TEXT}</span></div>
      <div class="item ${c.groups[sel]?"done":""} ${locked?"locked":""}" data-grp="${sel}" ${locked?'data-locked="1"':""}><div class="box"></div><span>${GROUPS_TEXT}</span></div>
      ${sel<WARMUP_DAYS?`<button class="btn ghost inline" data-sel="${sel+1}" style="margin-top:12px">Ver dia ${sel+1} →</button>`:(s.key==="heat"?`<p class="hint" style="margin-top:12px">Depois do dia ${WARMUP_DAYS}, o chip começa a disparar com ${RAMP.start} mensagens.</p>`:"")}
    </div>`;
  }

  /* Histórico */
  const hist=Object.entries(c.sent||{}).filter(([,n])=>n>0).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,10);
  if(tab==="disp" && hist.length){
    h+=`<div class="card"><h2>Histórico de disparos</h2><table class="hist">${hist.map(([dt,n])=>{const g=goalOn(c,dt);return `<tr><td>${fmtFull(dt)}</td><td>${g?"meta "+g:"no aquecimento"}</td><td style="color:${(g&&n>g)||!g?"var(--warn)":"var(--text)"}">${n}</td></tr>`;}).join("")}</table></div>`;
  }

  /* Ações */
  h+=`<div class="row" style="margin-top:6px">${(s.key==="heat"||s.key==="fire")?`<button class="btn warn inline" id="downBtn">Meu chip caiu</button>`:""}
    <button class="btn ghost inline" id="removeBtn">Excluir chip</button></div>`;
  return h;
}

const MOTIVATIONS = [
  "Chip cair faz parte da rotina de quem trabalha com disparo. Quem tem resultado é quem mantém a constância.",
  "Não é o chip que faz o resultado, é você voltando todo dia.",
  "Todo mundo que fatura com disparo já perdeu chip. A diferença é que não parou.",
  "Um chip caiu, o método continua. Pega o próximo e segue.",
  "Constância vence sorte. Amanhã você dispara de novo.",
  "Cada queda te ensina algo sobre o seu ritmo. Use isso a seu favor.",
  "Quem tem chip reserva não perde dia. Bora pro próximo.",
  "Resultado vem de semana após semana de disparo, não de um dia perfeito.",
  "Hoje foi um tropeço, não um ponto final.",
  "Os alunos que mais faturam são os que mais voltaram depois de uma queda."
];
function dayIndex(){ return Math.floor(new Date(todayStr()+"T00:00:00").getTime()/86400000); }
function tipOfDay(){ return DAILY_TIPS[dayIndex() % DAILY_TIPS.length]; }
function motivation(seed){ return MOTIVATIONS[Math.abs(seed) % MOTIVATIONS.length]; }
function dailyTipHtml(){
  const t=tipOfDay();
  return `<div class="card know"><div class="knowHead"><span class="knowIc">${I.bulb}</span><h2 style="margin:0">Dica do dia</h2></div>
    <div class="tip" style="margin:12px 0 0"><h3>${esc(t.t)}</h3><p style="margin:0">${esc(t.d)}</p></div></div>`;
}
function pickTips(c, ev){
  const keys=[];
  keys.push(ev.type==="dead" ? "ban" : "restr");
  const fd = c.ramp || dayOf(c)>WARMUP_DAYS ? fireDay(c) : 0;
  if(c.type==="Chip virtual") keys.push("virtual");
  else if(fd>0 && fd<=7) keys.push("novo");
  const pool=["denun","resp","aparelho","perfil","reserva"];
  const seed=(c.id.length + (ev.date||"").split("-").reduce((a,b)=>a+ +b,0)) % pool.length;
  for(let k=0; keys.length<3 && k<pool.length; k++){ const t=pool[(seed+k)%pool.length]; if(!keys.includes(t)) keys.push(t); }
  const out=keys.map(k=>TIPS[k]);
  out.push(DAILY_TIPS[(dayIndex()+c.id.length)%DAILY_TIPS.length]);
  return out;
}
function knowHtml(c, ev){
  return `<div class="card know"><div class="knowHead"><span class="knowIc">${I.bulb}</span><h2 style="margin:0">Pra você entender melhor</h2></div>
    <p class="hint" style="margin:6px 0 14px">Entender como o WhatsApp funciona é o que faz seu próximo chip durar mais.</p>
    ${pickTips(c,ev).map(t=>`<div class="tip"><h3>${esc(t.t)}</h3><p style="margin:0">${esc(t.d)}</p></div>`).join("")}
  </div>`;
}
function reportHtml(r){
  let h=`<div class="card"><h2>O que dá pra ajustar no próximo</h2>`;
  if(!r.length) h+=`<p>Nada do que você marcou explica a queda. Às vezes o chip cai sem um motivo claro, e tudo bem. Volte amanhã e mantenha a constância.</p>`;
  r.forEach(x=>{ h+=`<div class="cause ${x.tag==="Detectado pelo app"?"auto":""}"><div class="tag">${x.tag}</div><h3 style="margin-top:6px">${esc(x.why)}</h3><p style="margin:0">${esc(x.fix)}</p></div>`; });
  return h+`</div>`;
}

function bindChip(c){
  const $=id=>document.getElementById(id);
  $("back").onclick=()=>{view={page:"home"};render();};
  document.querySelectorAll("[data-check]").forEach(el=>el.onclick=()=>{ if(el.dataset.locked){toast("Esse dia ainda não chegou");return;} c.checks[el.dataset.check]=!c.checks[el.dataset.check]; save(); render(); });
  document.querySelectorAll("[data-grp]").forEach(el=>el.onclick=()=>{ if(el.dataset.locked){toast("Esse dia ainda não chegou");return;} c.groups=c.groups||{}; const n=el.dataset.grp; c.groups[n]=!c.groups[n]; save(); render(); });
  document.querySelectorAll("[data-day]").forEach(el=>el.onclick=()=>{ if(el.dataset.locked){toast("Esse dia ainda não chegou");return;} const n=el.dataset.day; c.daily[n]=!c.daily[n]; save(); render(); });
  document.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{ view.tab=el.dataset.tab; view.tabChip=c.id; render(); });
  document.querySelectorAll("[data-sel]").forEach(el=>el.onclick=()=>{ view.selDay=+el.dataset.sel; view.selChip=c.id; render(); });
  document.querySelectorAll("[data-pre]").forEach(el=>el.onclick=()=>{ if(!c.pre||c.pre.date!==todayStr()) c.pre={date:todayStr(),checks:{}}; c.pre.checks[el.dataset.pre]=!c.pre.checks[el.dataset.pre]; save(); render(); });
  document.querySelectorAll("[data-dd]").forEach(el=>el.onclick=()=>{ if(el.dataset.fut){ toast("Esse dia ainda não chegou"); return; } view.dispDay=el.dataset.dd; view.dispChip=c.id; render(); const i=document.getElementById("sentInput"); if(i) i.focus(); });
  if($("saveSent")){
    const doSave=()=>{ const v=parseInt($("sentInput").value,10); const dt=$("saveSent").dataset.date||todayStr(); c.sent=c.sent||{}; c.sent[dt]=isNaN(v)?0:Math.max(0,v); save(); render(); toast("Disparos salvos"); };
    $("saveSent").onclick=doSave; $("sentInput").onkeydown=e=>{ if(e.key==="Enter") doSave(); };
  }
  if($("downBtn")) $("downBtn").onclick=()=>startDiagnosis(c);
  if($("resumeBtn")) $("resumeBtn").onclick=()=>{
    const ev=[...c.events].reverse().find(e=>e.type==="pause");
    const back=Math.max(RAMP.start, goalOn(c, ev?ev.date:todayStr()));
    c.ramp={date:todayStr(), base:back}; c.paused=false; c.events.push({type:"resume",date:todayStr()}); save(); render(); toast("Bora! Meta de hoje: "+back);
  };
  if($("newFromDead")) $("newFromDead").onclick=()=>{view={page:"new"};render();window.scrollTo(0,0);};
  if($("reviveBtn")) $("reviveBtn").onclick=()=>{ c.dead=false; c.paused=true; c.events.push({type:"pause",date:todayStr(),report:([...c.events].reverse().find(e=>e.type==="dead")||{}).report}); save(); render(); };
  $("removeBtn").onclick=()=>confirmDelete(c);
  if($("delTop")) $("delTop").onclick=()=>confirmDelete(c);
}

/* ---- Diagnóstico (chip caiu) ---- */
function startDiagnosis(c){
  openModal(`<h2>O que aconteceu com o chip?</h2>
    <button class="opt" data-kind="pause">Restrição temporária<small>Não consigo mandar mensagem por um tempo</small></button>
    <button class="opt" data-kind="pause">Mensagens não entregam<small>Ficam com um tracinho só</small></button>
    <button class="opt" data-kind="dead">Banido<small>O número foi desconectado ou não consigo entrar</small></button>
    <button class="btn ghost inline" id="mNo">Cancelar</button>`, ()=>{
      document.getElementById("mNo").onclick=closeModal;
      document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>diagnosisStep2(c,b.dataset.kind));
  });
}
function diagnosisStep2(c, kind){
  const picked={};
  openModal(`<h2>Marque o que você fez</h2><p>Isso é só pra você ajustar o que der no próximo disparo. Chip cair faz parte.</p>
    ${ASK_CAUSES.map(x=>`<div class="item" data-cause="${x.id}"><div class="box"></div><span>${esc(x.q)}</span></div>`).join("")}
    <div class="row" style="margin-top:14px"><button class="btn inline" id="mGo">Ver diagnóstico</button><button class="btn ghost inline" id="mNo">Cancelar</button></div>`, ()=>{
      document.querySelectorAll("[data-cause]").forEach(el=>el.onclick=()=>{ picked[el.dataset.cause]=!picked[el.dataset.cause]; el.classList.toggle("done",picked[el.dataset.cause]); });
      document.getElementById("mNo").onclick=closeModal;
      document.getElementById("mGo").onclick=()=>{
        const report=[...autoCauses(c), ...ASK_CAUSES.filter(x=>picked[x.id]).map(x=>({tag:"Você marcou",why:x.why,fix:x.fix}))];
        if(kind==="dead"){ c.dead=true; } else { c.paused=true; }
        c.events.push({type:kind,date:todayStr(),report});
        save(); closeModal(); render(); window.scrollTo(0,0);
      };
  });
}

/* ---- Utilidades ---- */
function confirmDelete(c){
  openModal(`<h2>Excluir ${esc(c.name)}?</h2><p>O chip e todo o histórico dele vão ser apagados. Não dá pra desfazer.</p>
    <div class="row"><button class="btn bad inline" id="mYes">Excluir</button><button class="btn ghost inline" id="mNo">Cancelar</button></div>`,
    ()=>{ document.getElementById("mYes").onclick=()=>{ state.chips=state.chips.filter(x=>x.id!==c.id); save(); closeModal(); view={page:"home"}; render(); toast("Chip excluído"); };
          document.getElementById("mNo").onclick=closeModal; });
}
function openModal(html,bind){ document.getElementById("modalBody").innerHTML=html; document.getElementById("modal").classList.add("open"); bind&&bind(); }
function closeModal(){ document.getElementById("modal").classList.remove("open"); }
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
let tt; function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),1800); }

render();
bootAuth();
</script>
